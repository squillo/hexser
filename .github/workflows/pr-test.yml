# CI for the hexser workspace.
#
# Toolchain is read from rust-toolchain.toml (single source of truth — no stable/nightly
# split-brain). The shipped crate (lib + bins) is held to zero clippy/doc warnings; examples
# and test fixtures (which legitimately print and carry illustrative unused fields) must compile
# and pass but are not style-gated.
#
# Revision History
# - 2026-07-21T00:00:00Z @AI: Rework CI — read toolchain from rust-toolchain.toml, add push-on-main + feature-matrix + doctest coverage + realworld example + cargo-deny; scope clippy -D warnings to lib+bins.
# - 2025-10-09T08:27:00Z @AI: Add artifact storage for binaries, documentation, and clippy reports.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fastest feedback: formatting.
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all -- --check

  # Clippy on the shipped crate (library + binaries) with warnings denied.
  clippy:
    name: Clippy (lib + bins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: clippy
      - run: cargo clippy --workspace --all-features --lib --bins -- -D warnings

  # Tests with default features. No --all-targets, so doctests run.
  test-default:
    name: Test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: test-default
          rustflags: ""
      - run: cargo test --workspace

  # Tests with all features (unit + integration + doctests). Also builds the shipped binaries.
  test-all-features:
    name: Test (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: test-all-features
          rustflags: ""
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --all-features --bins --release
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: binaries
          path: |
            target/release/hex-ai-export
            target/release/hex-ai-pack
            target/release/hex-mcp-server
          retention-days: 7
          if-no-files-found: warn

  # Feature matrix: no-default-features and each feature in isolation. This is what would have
  # caught the visualization-off stack overflow.
  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: feature-matrix
          rustflags: ""
      - run: cargo check -p hexser --no-default-features
      - run: cargo check -p hexser --no-default-features --features macros
      - run: cargo check -p hexser --no-default-features --features serde
      - run: cargo check -p hexser --no-default-features --features static-di
      - run: cargo check -p hexser --no-default-features --features ai
      - run: cargo check -p hexser --no-default-features --features mcp
      - run: cargo check -p hexser --no-default-features --features visualization
      - run: cargo check -p hexser --no-default-features --features async
      - run: cargo check -p hexser --no-default-features --features container
      - run: cargo check -p hexser --all-features

  # Examples must compile (they legitimately print, so they are not clippy -D gated).
  examples:
    name: Examples build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: examples
          rustflags: ""
      - run: cargo build -p hexser --all-features --examples

  # The flagship realworld_api example is an isolated workspace; build + test it explicitly.
  realworld-example:
    name: Realworld example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: realworld
          rustflags: ""
      - run: cargo test
        working-directory: hexser/examples/realworld_api

  # Documentation builds with warnings denied.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: docs
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Supply-chain: advisory + license/ban checks.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Install the pinned toolchain so `cargo metadata` (invoked by cargo-deny) resolves the
      # rust-toolchain.toml override on the host.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: cargo-deny
          rustflags: ""
      - uses: EmbarkStudios/cargo-deny-action@v2
