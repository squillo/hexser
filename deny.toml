# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
#
# Revision History
# - 2026-07-21T00:00:00Z @AI: Initial supply-chain policy (advisories + permissive license allow-list).

[advisories]
version = 2
# Fail on any security advisory; ignore list is empty until a specific waiver is justified.
ignore = []

[licenses]
version = 2
# Licenses acceptable for this workspace's dependency tree (all permissive / MIT-compatible).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Warn on multiple versions of the same crate; deny nothing outright yet.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
